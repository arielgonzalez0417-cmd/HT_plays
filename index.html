<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3efe6; --surface: #fffdf8; --ink: #1b2a26; --muted: #5d6b66;
    --line: #d8d1c1; --accent: #c8501e; --board: #1f3a33; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14201c; --surface: #1b2c26; --ink: #efe9da; --muted: #a2b0aa;
      --line: #2e443c; --accent: #f08a54; --board: #0d1714; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Source Serif 4", Georgia, serif; line-height: 1.6; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { background: var(--board); color: #f4efe2; padding: 56px 24px 48px; }
  header a { text-decoration: none; }
  h1 { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: clamp(3rem, 9vw, 6rem); line-height: .95; margin: 0 0 16px; }
  header p { max-width: 52ch; margin: 0; color: #cfd8d2; font-size: 1.1rem; }
  main { padding: 24px 24px 72px; }

  /* Filters */
  nav.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 20px; }
  nav.filters button {
    font: 600 1.05rem "Barlow Condensed", "Arial Narrow", sans-serif;
    background: transparent; color: var(--ink); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 6px 16px; min-height: 44px; cursor: pointer;
  }
  nav.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Play list: each row is a link */
  .list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  .list li { border-bottom: 1px solid var(--line); }
  .list a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 18px 4px; text-decoration: none;
  }
  .list a:hover .name { color: var(--accent); text-decoration: underline; }
  .name { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 1.9rem; line-height: 1.1; }
  .cat { color: var(--muted); font-size: .95rem; white-space: nowrap; }

  /* Single play view */
  .back { display: inline-block; padding: 10px 0; color: var(--accent); font-weight: 600; }
  .play h2 { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: clamp(2rem, 6vw, 3rem); margin: 4px 0 0; line-height: 1.05; }
  .play .tag { color: var(--muted); margin: 4px 0 16px; }
  .frame { position: relative; width: 100%; aspect-ratio: 8 / 5; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 12px; }
  .actions a, .actions button {
    font: 600 1rem "Source Serif 4", Georgia, serif; color: var(--accent); background: none;
    border: 0; padding: 10px 0; text-decoration: underline; cursor: pointer;
  }
  .empty { color: var(--muted); padding: 32px 0; }
  footer { padding: 24px; color: var(--muted); border-top: 1px solid var(--line); text-align: center; font-size: .9rem; }

  @media (max-width: 700px) {
    header { padding: 36px 16px 32px; }
    main { padding: 16px 16px 56px; }
    .name { font-size: 1.6rem; }
    .list a { flex-direction: column; gap: 2px; padding: 16px 0; }
    nav.filters { flex-wrap: nowrap; overflow-x: auto; }
    nav.filters button { flex: 0 0 auto; }
    .frame { aspect-ratio: auto; height: 78vh; min-height: 460px; max-height: 720px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="#"><h1>Playbook</h1></a>
    <p>Our sets, out of timeouts, and baseline plays. Pick a play to see each phase.</p>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>
<footer>Plays built with the Play Creator app from The Hoops Geek.</footer>

<script>
  // ADD YOUR PLAYS HERE. "code" is the value after ?code= in the embed link.
  // "slug" is the end of the play's own web address (site.com/#slug). Use lowercase letters, numbers, hyphens.
  const PLAYS = [
    { slug: "sample-play", code: "00ray9fBPt", title: "Sample play", category: "Half court" }
    // { slug: "horns-flex", code: "YOUR_CODE", title: "Horns Flex", category: "Half court" },
  ];

  const EMBED_BASE = "https://www.thehoopsgeek.com/react-apps/PlayCreator/embed/";
  const OPTIONS = "showTitle=1&showVideo=1&showDescription=1&showPhaseDescriptions=1";
  const view = document.getElementById("view");
  let activeCat = "All";

  const embedUrl = code => EMBED_BASE + "?code=" + encodeURIComponent(code) + "&" + OPTIONS;

  function el(tag, props = {}, ...kids) {
    const n = Object.assign(document.createElement(tag), props);
    kids.forEach(k => n.append(k));
    return n;
  }

  function renderList() {
    document.title = "Playbook";
    view.replaceChildren();
    const cats = ["All", ...new Set(PLAYS.map(p => p.category))];
    if (cats.length > 2) {
      const nav = el("nav", { className: "filters" });
      nav.setAttribute("aria-label", "Filter plays by category");
      cats.forEach(c => {
        const b = el("button", { type: "button", textContent: c });
        b.setAttribute("aria-pressed", String(c === activeCat));
        b.onclick = () => { activeCat = c; renderList(); };
        nav.append(b);
      });
      view.append(nav);
    }
    const items = PLAYS.filter(p => activeCat === "All" || p.category === activeCat);
    if (!items.length) { view.append(el("p", { className: "empty", textContent: "No plays yet." })); return; }
    const ul = el("ul", { className: "list" });
    items.forEach(p => {
      const a = el("a", { href: "#" + p.slug }, el("span", { className: "name", textContent: p.title }), el("span", { className: "cat", textContent: p.category }));
      ul.append(el("li", {}, a));
    });
    view.append(ul);
  }

  function renderPlay(p) {
    document.title = p.title + " | Playbook";
    view.replaceChildren();
    const ifr = el("iframe", { title: p.title + " play diagram", src: embedUrl(p.code), allowFullscreen: true });
    ifr.allow = "fullscreen";
    const copy = el("button", { type: "button", textContent: "Copy link to this play" });
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); copy.textContent = "Link copied"; }
      catch (e) { copy.textContent = "Copy the address bar link"; }
    };
    view.append(
      el("a", { className: "back", href: "#", textContent: "All plays" }),
      el("article", { className: "play" },
        el("h2", { textContent: p.title }),
        el("p", { className: "tag", textContent: p.category }),
        el("div", { className: "frame" }, ifr),
        el("div", { className: "actions" },
          el("a", { href: embedUrl(p.code), target: "_blank", rel: "noopener", textContent: "Open full screen" }),
          copy)
      )
    );
  }

  function route() {
    const slug = decodeURIComponent(location.hash.slice(1));
    const p = PLAYS.find(x => x.slug === slug);
    if (p) renderPlay(p); else renderList();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
